[project]
name = "toolbox"
version = "0.1.0"
description = "SDM Toolbox — species distribution modelling with GEE and NiceGUI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Google Earth Engine
    "earthengine-api>=0.1.390",
    "geemap>=0.32.0",
    # Data / geo
    "geopandas>=0.14",
    "pandas>=2.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "shapely>=2.1",
    "scipy>=1.17",
    "scikit-learn>=1.8",
    "pygbif>=0.6.6",
    # Visualisation
    "folium>=0.18",
    "matplotlib>=3.10",
    "xyzservices>=2024",
    # Desktop UI
    "nicegui>=2.0",
    "pywebview>=5.0",
    "httpx>=0.27",
    # Notebook support
    "ipython>=8.18",
    "statsmodels>=0.14",
    "python-box>=7.1",
    "pyqt6>=6.10",
    "qtpy>=2.4",
    "pyqt6-webengine>=6.10",
    "ruff>=0.15.6",
    "ty>=0.0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolbox", "app"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
